<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mynt's Site - RNGame</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <section>
            <h2>RNGame!</h2>
            <button onclick="ButtonClicked()">Get a random number!</button>
            <p>Your number is: <span id="roll" class="rollStats">-</span> :3</p>
            <p>Total Numbers: <span id="rTotal" class="rollStats">0</span></p>
        </section>
        <section>
            <h4>Points (Unfinished)</h4>
            <p>This Number: <span id="pRoll" class="rollStats">-</span></p>
            <p>This Session: <span id="pTotal" class="rollStats">-</span></p>
        </section>
        <section>
            <h3>Previous Numbers:</h3>
            <ol id="prevRolls">
                <li id="n1" class="rollStats">-</li>
                <li id="n2" class="rollStats">-</li>
                <li id="n3" class="rollStats">-</li>
                <li id="n4" class="rollStats">-</li>
                <li id="n5" class="rollStats">-</li>
                <li id="n6" class="rollStats">-</li>
                <li id="n7" class="rollStats">-</li>
                <li id="n8" class="rollStats">-</li>
                <li id="n9" class="rollStats">-</li>
            </ol>
        </section>
        <script src="main.js"></script>
        <script src="scoreRoll.js"></script>
    </body>
</html>
